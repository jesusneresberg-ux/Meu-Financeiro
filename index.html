<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>CrediGestor</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=32" />
  <link rel="stylesheet" href="enhancements.css?v=32" />
  <link rel="stylesheet" href="payment-history.css?v=32" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">GESTÃO DE CRÉDITO</div>
        <h1 id="appTitle">CrediGestor</h1>
        <details id="appVersionInfo" style="font-size:12px;line-height:1.5;margin-top:4px;overflow-wrap:anywhere">
          <summary>Sobre o CrediGestor</summary>
          <dl style="margin:4px 0">
            <dt>Versão da interface</dt><dd style="margin-left:12px">2026.10.30</dd>
            <dt>Compilação da interface</dt><dd style="margin-left:12px">2026103002</dd>
            <dt>Publicação</dt><dd style="margin-left:12px">GitHub Pages / Firebase</dd>
            <dt>Novidades</dt><dd style="margin-left:12px">Cobrança principal e extrato na aba Empréstimos</dd>
            <dt>Versão e compilação do APK</dt><dd style="margin-left:12px">Não disponíveis nesta interface.</dd>
          </dl>
        </details>
      </div>
      <div class="topbar-actions">
        <button id="accountQuickBtn" class="icon-btn" title="Conta">👤</button>
        <button id="themeQuickBtn" class="icon-btn" title="Trocar tema">◐</button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav bottom-nav-v2" aria-label="Navegação principal">
      <button data-view="dashboard" class="nav-btn active"><span>⌂</span><small>Dashboard</small></button>
      <button data-view="clients" class="nav-btn"><span>👥</span><small>Clientes</small></button>
      <button data-view="loans" class="nav-btn"><span>💰</span><small>Empréstimos</small></button>
      <button data-view="charges" class="nav-btn"><span>✓</span><small>Cobranças</small></button>
      <button data-view="crm" class="nav-btn"><span>☷</span><small>CRM</small></button>
      <button data-view="settings" id="settingsNavBtn" class="nav-btn"><span>⚙</span><small>Config.</small></button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modalCard">
      <button class="modal-close" value="cancel" aria-label="Fechar">×</button>
      <div id="modalContent"></div>
    </form>
  </dialog>

  <input id="importInput" type="file" accept=".json,.csv,application/json,text/csv" hidden />

  <!-- Scripts principais -->
  <script src="app.js?v=32"></script>
  <script src="enhancements.js?v=32"></script>
  <script src="backup-csv.js?v=32"></script>

  <!-- Firebase e Auth Google -->
  <script async defer src="https://accounts.google.com/gsi/client"></script>

  <!-- Módulos de funcionalidades -->
  <script src="features-v5.js?v=32"></script>
  <script src="features-v6.js?v=32"></script>
  <script src="features-v7.js?v=32"></script>
  <script src="features-v8.js?v=32"></script>
  <script src="features-v10.js?v=32"></script>
  <script src="features-v11.js?v=32"></script>
  <script src="features-v12.js?v=32"></script>
  <script src="features-v13.js?v=32"></script>
  <script src="features-v15.js?v=32"></script>
  <script src="features-v16.js?v=32"></script>
  <script src="features-v17.js?v=32"></script>
  <script src="features-v18.js?v=32"></script>
  <script src="features-v19.js?v=32"></script>
  <script src="features-v20.js?v=32"></script>
  <script src="features-v21.js?v=32"></script>
  <script src="features-v22.js?v=32"></script>
  <script src="features-v23.js?v=32"></script>
  <script src="features-v24.js?v=32"></script>
  <script src="features-v25.js?v=32"></script>
  <script src="features-v26.js?v=32"></script>
  <script src="features-v27.js?v=32"></script>
  <script src="charge-search.js?v=32"></script>

  <!-- NOVO: Módulo de histórico de pagamentos -->
  <script src="features-payment-history.js?v=32"></script>
</body>
</html>
